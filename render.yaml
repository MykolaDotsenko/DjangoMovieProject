services:
  - type: web
    name: movieshelf-django
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    initialDeployHook: python manage.py loaddata demo
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 4
      --timeout 60
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_DATABASE_BACKEND
        value: postgresql
      - key: DJANGO_DB_NAME
        fromDatabase:
          name: movieshelf-db
          property: database
      - key: DJANGO_DB_USER
        fromDatabase:
          name: movieshelf-db
          property: user
      - key: DJANGO_DB_PASSWORD
        fromDatabase:
          name: movieshelf-db
          property: password
      - key: DJANGO_DB_HOST
        fromDatabase:
          name: movieshelf-db
          property: host
      - key: DJANGO_DB_PORT
        value: "5432"
      - key: DJANGO_DB_CONN_MAX_AGE
        value: "60"
      - key: DJANGO_USE_WHITENOISE
        value: "true"
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "false"
      - key: DJANGO_LOG_LEVEL
        value: INFO

databases:
  - name: movieshelf-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: movieshelf
    user: movieshelf
