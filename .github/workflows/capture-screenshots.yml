name: Capture portfolio screenshots

on:
  push:
    branches: [portfolio-presentation]
    paths-ignore:
      - "docs/screenshots/**"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install application
        run: python -m pip install -r requirements.txt

      - name: Prepare demo database
        env:
          DJANGO_SECRET_KEY: screenshot-ci-secret
        run: |
          python manage.py migrate --noinput
          python manage.py loaddata demo

      - name: Start Django
        env:
          DJANGO_SECRET_KEY: screenshot-ci-secret
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/movieshelf.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/movieshelf.log
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture real application screenshots
        run: |
          mkdir -p docs/screenshots
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch();

            const desktop = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
            });

            await desktop.goto("http://127.0.0.1:8000/", { waitUntil: "networkidle" });
            await desktop.screenshot({
              path: "docs/screenshots/home-desktop.png",
              fullPage: true,
            });

            await desktop.goto("http://127.0.0.1:8000/movies/", { waitUntil: "networkidle" });
            await desktop.screenshot({
              path: "docs/screenshots/movies-desktop.png",
              fullPage: true,
            });

            const mobile = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
            });

            await mobile.goto("http://127.0.0.1:8000/", { waitUntil: "networkidle" });
            await mobile.screenshot({
              path: "docs/screenshots/home-mobile.png",
              fullPage: true,
            });

            await browser.close();
          })();
          NODE

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Add real MovieShelf screenshots"
          git push origin HEAD:portfolio-presentation
