[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["imdb/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["imdb"]
omit = [
    "imdb/admin.py",
    "imdb/apps.py",
    "imdb/migrations/*",
    "imdb/tests/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
