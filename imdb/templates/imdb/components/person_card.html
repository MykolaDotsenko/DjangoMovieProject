<article class="person-card h-100">
  <a
    class="text-decoration-none text-light"
    href="{% url 'imdb:person-detail' pk=person.pk %}"
  >
    <div class="person-photo">
      {% if person.portrait %}
        <img
          src="{{ person.portrait.url }}"
          alt="{{ person }}"
          loading="lazy"
          decoding="async"
        >
      {% else %}
        <div class="person-placeholder" aria-hidden="true">
          <i class="fa-solid fa-user"></i>
        </div>
      {% endif %}
    </div>
    <div class="p-3">
      <h3 class="h6 mb-1">{{ person }}</h3>
      {% if show_credit_count %}
        <span class="small text-muted-app">
          {{ person.credit_count }} credit{{ person.credit_count|pluralize }}
        </span>
      {% endif %}
    </div>
  </a>
</article>
