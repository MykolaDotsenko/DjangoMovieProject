<article class="movie-card h-100">
  <a
    class="text-decoration-none text-light"
    href="{% url 'imdb:movie-detail' pk=movie.pk %}"
  >
    <div class="poster-wrap">
      {% if movie.poster %}
        <img src="{{ movie.poster.url }}" alt="{{ movie.title }} poster">
      {% else %}
        <div class="poster-placeholder" aria-label="No poster available">
          <i class="fa-regular fa-image" aria-hidden="true"></i>
        </div>
      {% endif %}
    </div>
    <div class="p-3">
      <h2 class="h6 mb-2">{{ movie.title }}</h2>
      <div class="d-flex justify-content-between gap-2 small">
        <span class="rating">
          <i class="fa-solid fa-star" aria-hidden="true"></i>
          {{ movie.rating|floatformat:1 }}
        </span>
        {% if movie.release_date %}
          <span class="text-muted-app">{{ movie.release_date|date:"Y" }}</span>
        {% endif %}
      </div>
    </div>
  </a>
</article>
